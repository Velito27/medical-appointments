services:
  - type: web
    name: medicos-api
    runtime: python
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: POSTGRES_HOST
        fromDatabase:
          name: medicos-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: medicos-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: medicos-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: medicos-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: medicos-db
          property: password
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: medicos
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"

  - type: web
    name: medicos
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medicos-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: medicos-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: medical_appointments
    user: medical_user
    ipAllowList: []
